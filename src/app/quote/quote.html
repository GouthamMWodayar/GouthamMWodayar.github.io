

<div class="form-container" id="quote">
  <h2>Contact Us</h2>
  <input type="text" [(ngModel)]="formData.name" placeholder="Your Name" required>
  <input type="text" [(ngModel)]="formData.subject" placeholder="Subject" required>
  <input type="email" [(ngModel)]="formData.email" placeholder="Your Email ID" required>
  <input type="tel" [(ngModel)]="formData.phone" placeholder="Phone Number" pattern="[0-9]{10}"
  title="Enter a 10-digit phone number" required>
  <textarea [(ngModel)]="formData.message" placeholder="Your Message" required></textarea>
  <button (click)="sendEmail()">Get Quote</button>
</div>
